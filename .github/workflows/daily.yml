name: Daily meme

on:
  schedule:
    - cron: "0 6,9,12,15,18,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-meme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install -r requirements.txt

      - name: Create meme
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate.py

      - name: Save results
        run: |
          git config user.name "meme-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output history.json
          git commit -m "Daily meme" || echo "Nothing to commit"
          git push
