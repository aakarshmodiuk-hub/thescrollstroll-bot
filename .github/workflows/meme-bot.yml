# Save as .github/workflows/meme-bot.yml
name: meme-bot

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate only, do not post"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: meme-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: sudo apt-get install -y fonts-dejavu-core

      - run: pip install -r requirements.txt

      - name: Random delay (looks less robotic)
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 900))

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PAUSED: ${{ vars.PAUSED }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python bot.py

      - name: Upload preview (dry run only)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: images/