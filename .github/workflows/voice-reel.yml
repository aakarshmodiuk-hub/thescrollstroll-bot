name: Generate Voice Reel

on:
  schedule:
    - cron: "0 6,18 * * *"   # twice a day (UTC), ~100 min before the Make posting slots
  workflow_dispatch:          # lets you press "Run workflow" manually

permissions:
  contents: write

concurrency:
  group: reel-lane
  cancel-in-progress: false

jobs:
  voice-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools (FFmpeg, font, Pillow, optional backup voice)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-montserrat
          pip install pillow
          pip install edge-tts || echo "edge-tts is optional - continuing without it"

      - name: Make the Reel
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python reels/make_voice_reel.py

      - name: Save Reel to repo
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add reels/out/reel.mp4 reels/out/reel.json reels/out/history.json
          git commit -m "New voice reel $(date -u +'%Y-%m-%d %H:%M')" || echo "Nothing to commit"
          git pull --rebase origin main
          git push origin main
